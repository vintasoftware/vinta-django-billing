[tox]
requires =
    tox>=4.22
    tox-uv>=1.13
envlist =
    py311-django52
    py{312,313,314}-django{52,60,61}
    swapped
    lint
    typecheck

[testenv]
# uv-venv-runner (not the lock runner): the Django pin below must win over the
# version resolved in uv.lock.
runner = uv-venv-runner
dependency_groups = test
extras =
    stripe
    mercadopago
    openapi
setenv =
    PYTHONPATH = {toxinidir}
    DJANGO_SETTINGS_MODULE = tests.settings
commands =
    pytest --cov --cov-report=term-missing {posargs}
deps =
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2

[testenv:swapped]
# The same suite against a project that swapped `ORGANIZATION_MODEL` for its own
# model. Under the default settings the swappable reference and the concrete
# model are the same class, so a foreign key hardcoded to
# `vinta_orgs.Organization` passes everything else and only breaks in a real
# project -- this environment is what makes that failure visible here.
runner = uv-venv-runner
dependency_groups = test
extras =
    stripe
    mercadopago
    openapi
setenv =
    PYTHONPATH = {toxinidir}
    DJANGO_SETTINGS_MODULE = tests.settings_swapped
commands =
    pytest {posargs}

[testenv:lint]
runner = uv-venv-runner
dependency_groups = dev
skip_install = true
commands =
    ruff check .
    ruff format --check .

[testenv:typecheck]
runner = uv-venv-runner
dependency_groups = dev
# Not skip_install: the django-stubs plugin imports `tests.settings` and walks
# the app registry, so the package has to be importable.
setenv =
    PYTHONPATH = {toxinidir}
commands =
    mypy
