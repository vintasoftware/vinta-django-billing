name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        django: ["5.2", "6.0", "6.1"]
        exclude:
          # Django 6.0 raised the minimum Python version to 3.12.
          - python-version: "3.11"
            django: "6.0"
          - python-version: "3.11"
            django: "6.1"

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: |
          env_name="py${{ matrix.python-version }}-django${{ matrix.django }}"
          uv run --frozen tox -e "${env_name//./}"

      - name: Export coverage
        run: uv run --frozen coverage xml

      - uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: py${{ matrix.python-version }}-django${{ matrix.django }}
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  scope-models:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The model a scope *names* is swapped; billing still works.
          - { env: swapped, label: swapped payer model }
          # BILLING_SCOPE_MODEL itself is swapped, for a project with its own
          # typed scope model. A relation hardcoded to the shipped
          # `BillingScope` passes every other job and fails only here.
          - { env: scopeswapped, label: swapped scope model }
          # Users and companies billed from one table -- the configuration this
          # whole change exists to make possible.
          - { env: mixed, label: mixed user and company scopes }
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv run --frozen tox -e ${{ matrix.env }}

  without-vinta-django-orgs:
    name: no vinta-django-orgs installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      # The claim 0.8 makes, and the one no other job can check: every other
      # environment installs the `test` group, which still needs the package in
      # order to exercise `vinta_billing.contrib.orgs`. This one installs
      # neither that group nor the `orgs` extra, so a stray import or a
      # migration that reads ORGANIZATION_MODEL fails here and nowhere else.
      - run: uv run --frozen tox -e noorgs

  postgres:
    name: row locks (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      # The cycle-close row lock is the one behaviour SQLite cannot exercise:
      # it has no row locks, and Django drops SELECT ... FOR UPDATE there rather
      # than raising. tests/test_cycle_close_concurrency.py skips itself on
      # SQLite, so without this job the lock ships untested.
      - run: uv run --frozen tox -e postgres

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # Runs ruff, mypy and the file-hygiene hooks, exactly as the local hook
      # does. The mypy hook shells out to `uv run`, so the environment has to
      # exist before pre-commit starts.
      - run: uv sync --frozen

      - run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv build

      - name: Check the built distributions
        run: uvx twine check dist/*
